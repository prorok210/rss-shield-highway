name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run verification
        run: PYTHON=python ./run_all.sh

      - name: Compare table 3 with expected
        run: diff expected/table3.csv results/table3.csv

      - name: Check pytest summary
        run: test "$(grep -o "[0-9]* passed" results/pytest.txt)" = "$(grep -o "[0-9]* passed" expected/pytest.txt)"

      - name: Check sim equivalence
        run: python -m pytest -q -p no:cacheprovider sim/test_fast_road.py

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: |
            results/
            logs/
