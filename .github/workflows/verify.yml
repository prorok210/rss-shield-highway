name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run verification
        run: PYTHON=python ./run_all.sh

      - name: Compare table 3 with expected
        run: diff expected/table3.csv results/table3.csv

      - name: Check pytest summary
        run: grep -q "87 passed" results/pytest.txt

      - name: Check sim equivalence
        run: python -m pytest -q -p no:cacheprovider sim/test_fast_road.py

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: |
            results/
            logs/

      # The full outputs of the 3.13 job are posted to the PR so that expected/ is refreshed from a
      # real CI run (README, repository rules); the 3.14 job posts the comparison result only.
      - name: Post results to the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PYV: ${{ matrix.python-version }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$PYV" = "3.13" ]; then FULL=--full; else FULL=; fi
          python tools/ci_comment.py verify "$PYV" "$SHA" $FULL > ci_comment.md
          gh pr comment "$PR" --body-file ci_comment.md
